<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八字命理专家</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="pattern-bg">

<!-- 顶部标题栏 -->
<header class="header">
  <div class="header-logo">
    <span class="header-icon">☯</span>
    <div>
      <div class="header-title glow-gold">八字命理专家</div>
      <div class="header-subtitle">BAZI MASTER · 子平真诠</div>
    </div>
  </div>
  <div class="mode-toggle">
    <span class="mode-label" id="mode-label-left">规则引擎</span>
    <label class="toggle-switch">
      <input type="checkbox" id="mode-toggle-input">
      <span class="toggle-slider"></span>
    </label>
    <span class="mode-label" id="mode-label-right">Claude AI</span>
  </div>
</header>

<!-- 主内容 -->
<div class="main-container">

  <!-- 左侧面板 -->
  <div class="left-panel">

    <!-- 出生信息输入 -->
    <div class="card ornament-border">
      <div class="card-header">
        <span class="card-icon">📅</span>
        <span class="card-title">出生信息</span>
      </div>
      <div class="card-body">
        <form class="birth-form" id="birth-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">出生年份</label>
              <input type="number" class="form-input" id="birth-year" value="1990" min="1900" max="2100" placeholder="年">
            </div>
            <div class="form-group">
              <label class="form-label">出生月份</label>
              <select class="form-select" id="birth-month">
                <option value="1">一月</option>
                <option value="2">二月</option>
                <option value="3">三月</option>
                <option value="4">四月</option>
                <option value="5">五月</option>
                <option value="6">六月</option>
                <option value="7">七月</option>
                <option value="8">八月</option>
                <option value="9">九月</option>
                <option value="10">十月</option>
                <option value="11">十一月</option>
                <option value="12">十二月</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">出生日期</label>
              <input type="number" class="form-input" id="birth-day" value="27" min="1" max="31" placeholder="日">
            </div>
            <div class="form-group">
              <label class="form-label">出生时辰</label>
              <select class="form-select" id="birth-hour">
                <option value="23">子时 (23-01)</option>
                <option value="1">丑时 (01-03)</option>
                <option value="3">寅时 (03-05)</option>
                <option value="5">卯时 (05-07)</option>
                <option value="7">辰时 (07-09)</option>
                <option value="9">巳时 (09-11)</option>
                <option value="11">午时 (11-13)</option>
                <option value="13">未时 (13-15)</option>
                <option value="15" selected>申时 (15-17)</option>
                <option value="17">酉时 (17-19)</option>
                <option value="19">戌时 (19-21)</option>
                <option value="21">亥时 (21-23)</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">性别</label>
              <select class="form-select" id="birth-gender">
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">出生分钟（可选）</label>
              <input type="number" class="form-input" id="birth-minute" value="0" min="0" max="59" placeholder="0-59">
            </div>
          </div>
          <button type="submit" class="btn-calculate">✦ 起　卦 ✦</button>
        </form>
      </div>
    </div>

    <!-- 四柱展示 -->
    <div class="card ornament-border" id="pillar-card" style="display:none">
      <div class="card-header">
        <span class="card-icon">🏛</span>
        <span class="card-title">四　柱</span>
      </div>
      <div class="card-body">
        <table class="pillar-table" id="pillar-table">
          <thead>
            <tr>
              <th>年柱</th>
              <th>月柱</th>
              <th>日柱</th>
              <th>时柱</th>
            </tr>
          </thead>
          <tbody id="pillar-tbody">
          </tbody>
        </table>
      </div>
    </div>

    <!-- 五行分布 -->
    <div class="card ornament-border" id="wuxing-card" style="display:none">
      <div class="card-header">
        <span class="card-icon">⚡</span>
        <span class="card-title">五行格局</span>
      </div>
      <div class="card-body">
        <div id="wuxing-info" style="margin-bottom:12px"></div>
        <div class="wuxing-bars" id="wuxing-bars"></div>
        <hr class="divider">
        <div id="xiyong-info"></div>
      </div>
    </div>

  </div>

  <!-- 右侧面板 -->
  <div class="right-panel">

    <!-- 命理分析 Tab -->
    <div class="card ornament-border" id="analysis-card">
      <div class="card-header">
        <span class="card-icon">📜</span>
        <span class="card-title">命理解析</span>
      </div>
      <div class="card-body" style="padding-bottom:0">
        <div class="tabs" id="analysis-tabs">
          <button class="tab-btn active" data-section="overview">命格总论</button>
          <button class="tab-btn" data-section="personality">性格天赋</button>
          <button class="tab-btn" data-section="career">事业财运</button>
          <button class="tab-btn" data-section="dayun">大运流年</button>
          <button class="tab-btn" data-section="today">今日运势</button>
        </div>
      </div>
      <div class="card-body analysis-content" id="analysis-content">
        <div class="analysis-placeholder" id="analysis-placeholder">
          <span class="placeholder-icon">☯</span>
          <p>请填写出生信息，点击「起　卦」</p>
          <p style="font-size:11px;color:var(--text-muted)">支持规则引擎与 Claude AI 双模式解读</p>
        </div>
        <div id="analysis-text" style="display:none" class="analysis-text"></div>
        <div id="analysis-loading" style="display:none;padding:20px;text-align:center">
          <div class="loading-dots"><span></span><span></span><span></span></div>
          <p style="margin-top:12px;font-size:12px;color:var(--text-muted)">命理师正在推算中…</p>
        </div>
      </div>
    </div>

    <!-- 大运时间轴 -->
    <div class="card ornament-border" id="dayun-card" style="display:none">
      <div class="card-header">
        <span class="card-icon">🌊</span>
        <span class="card-title">大运时间轴</span>
        <span id="dayun-direction" style="margin-left:auto;font-size:11px;color:var(--text-muted)"></span>
      </div>
      <div class="card-body">
        <div class="dayun-timeline" id="dayun-timeline"></div>
        <hr class="divider">
        <div style="margin-bottom:8px;font-size:11px;color:var(--text-muted);letter-spacing:1px">流年（近20年）</div>
        <div class="liunian-grid" id="liunian-grid"></div>
      </div>
    </div>

    <!-- AI 对话 -->
    <div class="card ornament-border" id="chat-card" style="display:none">
      <div class="card-header">
        <span class="card-icon">💬</span>
        <span class="card-title">命理问答</span>
        <span style="margin-left:auto;font-size:11px;color:var(--gold-dark)">Claude AI</span>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-message assistant">
            <div class="chat-avatar">☯</div>
            <div class="chat-bubble">您好，我是您的八字命理专家。您的命盘已排定，可以向我提问任何关于命局的问题，例如：事业方向、感情姻缘、流年运势等。</div>
          </div>
        </div>
        <div class="chat-input-area">
          <textarea class="chat-input" id="chat-input" placeholder="请问命师…" rows="1"></textarea>
          <button class="chat-send-btn" id="chat-send-btn">发　送</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/js/bazi.js"></script>
<script src="/static/js/dayun.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
